<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="background:#1a1a1c;color:#e8e8ea;font:12px monospace;padding:8px;margin:0">
<div id="log">loading engine…</div>
<script src="stockfish.js"></script>
<script>
var RN = window.ReactNativeWebView;
function post(o){ if (RN) RN.postMessage(JSON.stringify(o)); }
function log(s){ var el=document.getElementById('log'); if(el) el.innerText=s; }
var sf=null, t0=0, lastScore='', gotUciok=false, lines=0, buf=[];
function show(s){ buf.unshift(s); if(buf.length>10) buf.pop(); log(buf.join('\n')); }
show('SAB=' + (typeof SharedArrayBuffer!=='undefined'));
window.onerror=function(m,src,l){ post({type:'error',msg:m+' @'+l}); show('ERR '+m); };
try {
  if (typeof STOCKFISH === 'undefined') throw 'stockfish.js did not load';
  sf = STOCKFISH();
  sf.onmessage = function(line){
    if (typeof line !== 'string') line = (line && line.data) || '';
    lines++;
    if (lines <= 6) show(line.slice(0,70));
    if (line.indexOf('uciok') >= 0){ gotUciok=true; post({type:'ready'}); show('>> engine ready'); }
    else if (line.indexOf('bestmove') === 0){
      var m = lastScore.match(/score (cp|mate) (-?\\d+)/);
      post({type:'result', bestmove:line.split(' ')[1], ms:Date.now()-t0,
            scoreType:m?m[1]:null, score:m?parseInt(m[2],10):null});
      show('>> best '+line.split(' ')[1]+'  '+(Date.now()-t0)+'ms');
    }
    else if (line.indexOf(' score ') >= 0) lastScore = line;
  };
  sf.postMessage('uci');
  setTimeout(function(){ if(!gotUciok) post({type:'error',msg:'no uciok after 6s ('+lines+' lines from engine)'}); }, 6000);
} catch(e){ post({type:'error', msg:'init: '+e}); show('INIT ERR '+e); }
window.runEval = function(fen, depth){
  if (!sf) return post({type:'error', msg:'engine not ready'});
  lastScore=''; t0=Date.now(); show('go depth '+depth+' …');
  sf.postMessage('position fen '+fen);
  sf.postMessage('go depth '+depth);
  setTimeout(function(){ post({type:'watchdog', ms:Date.now()-t0, lines:lines}); }, 6000);
};
</script></body></html>
